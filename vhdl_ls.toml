standard = "2019"
preferred_case = "lower"

[libraries]
src.files = ["src/**/*.vhdl"]
tests.files = ["tests/**/*.vhdl"]

vunit_lib.files = [
    ".venv/lib/*/*/vunit/vhdl/*.vhd",
    ".venv/lib/*/*/vunit/vhdl/*/src/*.vhd",
]
vunit_lib.is_third_party = true

osvvm.files = [".venv/lib/*/*/vunit/vhdl/osvvm/*.vhd"]
osvvm.is_third_party = true
